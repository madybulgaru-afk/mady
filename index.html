<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07152f" />
  <title>Pronto a partire? - Volare facile</title>
  <style>
    :root {
      --navy: #07152f;
      --navy-light: #102a5c;
      --accent: #22c7b8;
      --accent-dark: #11a89b;
      --bg: #f4f8fb;
      --card-bg: #ffffff;
      --text: #0b1630;
      --muted: #5c6b7c;
      --line: #dce6ee;
      --success: #167f64;
      --warning: #d97706;
      --radius: 20px;
      --shadow: 0 10px 30px rgba(7, 21, 47, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0,0,0,0.05);
      position: relative;
    }

    /* Topbar */
    .topbar {
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--navy);
      color: #fff;
      border-radius: 10px;
      display: grid;
      place-items: center;
    }

    /* Content Area */
    .content {
      padding: 20px;
      flex: 1;
      padding-bottom: 90px;
    }

    h1 { font-size: 2.1rem; letter-spacing: -0.04em; margin-bottom: 8px; line-height: 1.1; }
    h2 { font-size: 1.5rem; letter-spacing: -0.03em; margin-bottom: 12px; }
    p.lead { font-size: 1rem; color: var(--muted); margin-bottom: 20px; line-height: 1.4; }

    /* Buttons & CTAs */
    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-secondary { background: #e8f8f5; color: var(--accent-dark); }
    .btn-outline { background: transparent; border: 2px solid var(--line); color: var(--text); }
    .btn-ghost { background: #eff4f7; color: var(--navy); }

    /* Cards & Options */
    .option-card {
      background: #fff;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .option-card:hover, .option-card.active {
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .option-card h3 { font-size: 1.1rem; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .option-card p { font-size: 0.9rem; color: var(--muted); line-height: 1.3; }
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
    }

    /* Game / Quiz Elements */
    .game-box {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--line);
      margin-top: 15px;
    }
    .quiz-options { display: grid; gap: 10px; margin-top: 15px; }
    .quiz-btn {
      background: #fff;
      border: 1.5px solid var(--line);
      padding: 14px;
      border-radius: 14px;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
    }
    .quiz-btn.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; }
    .quiz-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

    /* Checklist Mode (Sto Partendo) */
    .checklist-step {
      background: #fff;
      border-radius: 16px;
      border: 1px solid var(--line);
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .check-box {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .checklist-step.done .check-box {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .checklist-step.done .step-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: min(480px, 100%);
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    /* Select Aeroporto */
    .airport-select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 600;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="app-shell" id="app">
</div>

<script>
// --- STATO DELL'APPLICAZIONE ---
const state = {
  screen: 'home',
  selectedAirport: 'FCO',
  completedLevels: JSON.parse(localStorage.getItem('completedLevels') || '[]'),
  departuresProgress: JSON.parse(localStorage.getItem('departuresProgress') || '[]'),
  quizState: { currentStep: 0 }
};

const AIRPORTS = {
  FCO: { name: 'Roma Fiumicino (FCO)', terminal: 'T1 / T3', fastLiquids: true },
  CIA: { name: 'Roma Ciampino (CIA)', terminal: 'T1', fastLiquids: false },
  MXP: { name: 'Milano Malpensa (MXP)', terminal: 'T1 / T2', fastLiquids: true }
};

// --- TUTTE LE DOMANDE DELLE SFIDE ---
const LEVEL_DATA = {
  1: {
    title: "Prepariamo le valigie",
    questions: [
      {
        q: "Dove metti il tuo Power Bank (caricabatterie portatile)?",
        options: ["🎒 Nello zaino / Bagaglio a mano", "🧳 Nella valigia grande da imbarcare", "⛔ È vietato portarlo"],
        correct: 0,
        explain: "Esatto! Le batterie al litio devono stare SEMPRE con te in cabina per ragioni di sicurezza."
      },
      {
        q: "Vuoi portare la tua crema preferita da 150ml nel bagaglio a mano (senza scanner C3 moderni):",
        options: ["La porto tranquillamente", "La devo mettere in boccette da max 100ml in bustina trasparente", "Non posso portarla in nessun modo"],
        correct: 1,
        explain: "Giusto! Nei varchi tradizionali il limite per singolo contenitore di liquidi/creme è di 100ml."
      },
      {
        q: "Le forbicine da unghie o un coltellino svizzero dove vanno?",
        options: ["Nel bagaglio a mano", "Nella valigia da stiva (o si lasciano a casa)", "In tasca nei pantaloni"],
        correct: 1,
        explain: "Bravissimo! Tutti gli oggetti appuntiti o taglienti vengono confiscati ai controlli se messi nel bagaglio a mano."
      }
    ]
  },
  2: {
    title: "Documenti & Carte d'Imbarco",
    questions: [
      {
        q: "Quando ti conviene fare il check-in online per farti una passeggiata ed evitare code?",
        options: ["In aeroporto al banco", "Da casa sul telefono 24-48 ore prima", "Mentre sei già sulla navetta"],
        correct: 1,
        explain: "Esatto! Facendolo prima hai subito il biglietto sul cellulare e vai dritto ai controlli di sicurezza."
      },
      {
        q: "Stai per volare fuori dall'Europa: cosa controlli assolutamente prima di chiudere casa?",
        options: ["Basta la tessera sanitaria", "Che il Passaporto sia valido e non in scadenza imminente", "Il codice fiscale"],
        correct: 1,
        explain: "Giusto! Molti paesi extra-UE richiedono che il passaporto abbia almeno 3 o 6 mesi di validità residua."
      },
      {
        q: "Hai salvato la carta d'imbarco sul telefono. Qual è un trucco furbissimo da fare prima di arrivare?",
        options: ["Fare uno screenshot o salvarla nel Wallet", "Mettere il telefono in modalità aereo subito", "Cancellare le email"],
        correct: 0,
        explain: "Perfetto! Se in aeroporto la rete prende male o manca il Wi-Fi, lo screenshot si apre sempre all'istante."
      }
    ]
  },
  3: {
    title: "Muoversi in Aeroporto",
    questions: [
      {
        q: "Sei appena entrato in aeroporto. Qual è la primissima cosa da guardare sui maxischermi?",
        options: ["Il prezzo del caffè al bar", "Il tuo volo per capire il banco o la zona dei controlli di sicurezza", "I voli in arrivo"],
        correct: 1,
        explain: "Bravissimo! Cerca subito il tuo numero di volo per capire da dove muoverti."
      },
      {
        q: "Ai Controlli di sicurezza tradizionale (senza scanner 3D), cosa devi tirar fuori dal bagaglio?",
        options: ["Solo le scarpe", "Portatile, tablet e la bustina dei liquidi", "Niente, va tutto dentro"],
        correct: 1,
        explain: "Esatto! Nei varchi classici PC e liquidi vanno adagiati separatamente nella vaschetta."
      },
      {
        q: "Vedi scritto 'Gate Closing' o 'In Imbarco' sul tabellone: che si fa?",
        options: ["C'è ancora tempo per fare shopping", "Metti il turbo verso il gate: le porte stanno chiudendo!", "Significa che l'aereo è già partito"],
        correct: 1,
        explain: "Esatto! I gate chiudono di norma 15-20 minuti prima dell'orario di decollo."
      }
    ]
  }
};

const DEPARTURE_STEPS = [
  { id: 'step1', title: 'Check-in online fatto?', desc: 'Prendi la carta d\'imbarco sul telefono o salvala nel Wallet per averla al volo.' },
  { id: 'step2', title: 'Cosa ti porti dietro?', desc: 'Dai un\'occhiata alle tasche e controlla i liquidi se non voli da un aeroporto con scanner C3.' },
  { id: 'step3', title: 'In quale Terminal devi andare?', desc: 'Ad esempio a Fiumicino controlla se la tua compagnia sta al T1 o al T3.' },
  { id: 'step4', title: 'Hai una valigia grande?', desc: 'Vai dritto al banco della tua compagnia (Bag Drop) e lasciala a loro.' },
  { id: 'step5', title: 'Controlli di sicurezza', desc: 'Tieni pronta la carta d\'imbarco. A Fiumicino (T1/T3 scanner C3) non serve neanche tirar fuori PC e liquidi dallo zaino!' },
  { id: 'step6', title: 'Direzione Gate!', desc: 'Segui i cartelli con la lettera del tuo gate, controlla gli schermi e goditi l\'attesa.' }
];

// --- FUNZIONI DI RENDER ---

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home') app.innerHTML = renderHome();
  else if (state.screen === 'play_map') app.innerHTML = renderPlayMap();
  else if (state.screen.startsWith('level')) {
    const lvlId = parseInt(state.screen.replace('level', ''));
    app.innerHTML = renderQuizLevel(lvlId);
  }
  else if (state.screen === 'departures_guide') app.innerHTML = renderDeparturesGuide();
}

function renderHome() {
  return `
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">✈</div>
        <span>Pronto a partire?</span>
      </div>
    </header>
    <div class="content">
      <h1>Prendere l'aereo senza impazzire</h1>
      <p class="lead">Scegli come vuoi muoverti oggi:</p>

      <div class="option-card" onclick="setScreen('play_map')">
        <h3>1. FAI UN TEST GIOCANDO <span class="badge">Modalità Gioco</span></h3>
        <p>Impariamo divertendoci: bagagli, documenti, controlli di sicurezza e gate.</p>
      </div>

      <div class="option-card active" onclick="setScreen('departures_guide')">
        <h3>2. STO PARTENDO ADESSO <span class="badge" style="background:#dcfce7; color:#15803d">Guida Reale</span></h3>
        <p>Sei già in viaggio? Ti drivo passo-passo da casa fino alla poltrona dell'aereo.</p>
      </div>
    </div>
  `;
}

function renderPlayMap() {
  const levels = [
    { id: 1, title: '1. Prepariamo le valigie', desc: 'Cosa metti in cabina, cosa in stiva e i liquidi' },
    { id: 2, title: '2. Documenti pronti!', desc: 'Check-in dal telefono, passaporti ed eviti le code' },
    { id: 3, title: '3. Muoversi in aeroporto', desc: 'Tabelloni, controlli di sicurezza e arrivo al gate' }
  ];

  return `
    <header class="topbar">
      <div class="brand"><span>Scegli il livello</span></div>
      <button class="btn btn-ghost" style="width:auto; padding:8px 12px" onclick="setScreen('home')">Indietro</button>
    </header>
    <div class="content">
      <h2>I tuoi step</h2>
      <p class="lead">Supera le sfide e impara tutti i trucchi per viaggiare tranquillo!</p>

      ${levels.map(l => {
        const done = state.completedLevels.includes(l.id);
        return `
          <div class="option-card" onclick="startLevel(${l.id})">
            <h3>${l.title}${done ? '✅' : ''}</h3>
            <p>${l.desc}</p>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// --- QUIZ ENGINE PER TUTTI I LIVELLI ---
function renderQuizLevel(lvl) {
  const data = LEVEL_DATA[lvl];
  const qObj = data.questions[state.quizState.currentStep];

  if (!qObj) {
    return `
      <div class="content" style="text-align:center; padding-top:40px">
        <div style="font-size:4rem">🎉</div>
        <h2>Livello ${lvl} completato!</h2>
        <p class="lead">Ottimo lavoro! Ora conosci benissimo questo passaggio.</p>
        <button class="btn btn-primary" onclick="completeLevel(${lvl})">Torna alla mappa sfide</button>
      </div>
    `;
  }

  return `
    <header class="topbar">
      <div class="brand"><span>${data.title}</span></div>
    </header>
    <div class="content">
      <p style="font-size:0.85rem; color:var(--muted); font-weight:700">DOMANDA ${state.quizState.currentStep + 1} DI ${data.questions.length}</p>
      <h2 style="margin-top:8px">${qObj.q}</h2>

      <div class="quiz-options">
        ${qObj.options.map((opt, idx) => `
          <button class="quiz-btn" onclick="checkQuizAnswer(${lvl},${idx}, ${qObj.correct}, this)">${opt}</button>
        `).join('')}
      </div>

      <div id="quiz-feedback" style="margin-top:15px"></div>
    </div>
    <div class="bottom-nav">
      <button class="btn btn-ghost" onclick="setScreen('play_map')">Esci</button>
    </div>
  `;
}

function checkQuizAnswer(lvl, selected, correct, btn) {
  const feedback = document.getElementById('quiz-feedback');
  const qObj = LEVEL_DATA[lvl].questions[state.quizState.currentStep];

  if (selected === correct) {
    btn.classList.add('correct');
    feedback.innerHTML = `<div style="background:#dcfce7; padding:12px; border-radius:12px; color:#15803d">
      <strong>Esatto!</strong> ${qObj.explain}
    </div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="nextQuizStep()">Prossima domanda →</button>`;
  } else {
    btn.classList.add('wrong');
    feedback.innerHTML = `<div style="background:#fee2e2; padding:12px; border-radius:12px; color:#b91c1c">
      <strong>Ops!</strong> Riprova, l'opzione giusta è un'altra.
    </div>`;
  }
}

function nextQuizStep() {
  state.quizState.currentStep++;
  render();
}

// --- MODALITÀ "STO PARTENDO" ---
function renderDeparturesGuide() {
  const ap = AIRPORTS[state.selectedAirport];

  return `
    <header class="topbar">
      <div class="brand"><span>Guida in tempo reale</span></div>
      <button class="btn btn-ghost" style="width:auto; padding:8px 12px" onclick="setScreen('home')">Home</button>
    </header>
    <div class="content">
      <label style="font-size:0.85rem; font-weight:700; color:var(--muted)">DA DOVE PARTE IL TUO VOLO?</label>
      <select class="airport-select" onchange="changeAirport(this.value)">
        ${Object.keys(AIRPORTS).map(k => `<option value="${k}" ${k===state.selectedAirport?'selected':''}>${AIRPORTS[k].name}</option>`).join('')}
      </select>

      <h2>I tuoi passi verso l'aereo</h2>
      <p class="lead">Spunta le voci man mano che le completi in aeroporto:</p>

      ${DEPARTURE_STEPS.map((step, idx) => {
        const isDone = state.departuresProgress.includes(step.id);
        return `
          <div class="checklist-step ${isDone ? 'done' : ''}" onclick="toggleChecklist('${step.id}')">
            <div class="check-box">${isDone ? '✓' : ''}</div>
            <div>
              <strong class="step-text">${idx + 1}.${step.title}</strong>
              <p style="font-size:0.85rem; color:var(--muted); margin-top:4px">${step.desc}</p>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// --- LOGICA E NAVIGAZIONE ---
function setScreen(screenName) {
  state.screen = screenName;
  state.quizState.currentStep = 0;
  render();
  window.scrollTo(0,0);
}

function startLevel(lvl) {
  state.quizState.currentStep = 0;
  setScreen('level' + lvl);
}

function completeLevel(lvl) {
  if (!state.completedLevels.includes(lvl)) {
    state.completedLevels.push(lvl);
    localStorage.setItem('completedLevels', JSON.stringify(state.completedLevels));
  }
  setScreen('play_map');
}

function toggleChecklist(stepId) {
  if (state.departuresProgress.includes(stepId)) {
    state.departuresProgress = state.departuresProgress.filter(id => id !== stepId);
  } else {
    state.departuresProgress.push(stepId);
  }
  localStorage.setItem('departuresProgress', JSON.stringify(state.departuresProgress));
  render();
}

function changeAirport(code) {
  state.selectedAirport = code;
  render();
}

// Inizializzazione
render();
</script>
</body>
</html>
