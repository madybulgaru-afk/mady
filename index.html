<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facile Volare - L'App per Viaggiare Senza Ansia</title>
  <style>
    :root {
      --primary: #0066cc;
      --bg-color: #f4f7fb;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --success: #27ae60;
      --danger: #e74c3c;
      --accent: #f39c12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--card-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      position: relative;
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .progress-bar {
      height: 6px;
      background-color: #e0e0e0;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    .content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .mission-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--primary);
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .screen-title {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #1a252f;
    }

    .friendly-text {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 14px;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
    }

    .visual-area {
      background: #eef2f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .feedback-box {
      padding: 16px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
      display: none;
    }

    .feedback-box.correct {
      background-color: #e8f8f0;
      border: 1px solid var(--success);
      color: #1e7e44;
      display: block;
    }

    .feedback-box.incorrect {
      background-color: #fde8e8;
      border: 1px solid var(--danger);
      color: #aa2e2e;
      display: block;
    }

    .next-btn {
      margin-top: auto;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
      width: 100%;
    }

    /* Grafiche Mini-Giochi */
    .turnstile-graphic {
      width: 140px;
      height: 90px;
      background: #333;
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-panel {
      width: 80px;
      height: 40px;
      background: rgba(0, 150, 255, 0.3);
      border: 2px solid #00aaff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.75rem;
    }

    .fids-board {
      background: #111;
      color: #ffcc00;
      font-family: monospace;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
    }

    .tray-graphic {
      width: 100%;
      height: 80px;
      border: 3px dashed #94a3b8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>✈️ Facile Volare</header>

    <div class="options-container" id="options-container"></div>

    <div class="feedback-box" id="feedback-box"></div>

    <button class="next-btn" id="next-btn" onclick="nextScreen()">AVANTI ➔</button>
  </div>
</div>
