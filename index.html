<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facile Volare - L'App per Viaggiare Senza Ansia</title>
  <style>
    :root {
      --primary: #0066cc;
      --bg-color: #f4f7fb;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --success: #27ae60;
      --danger: #e74c3c;
      --accent: #f39c12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--card-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      position: relative;
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .progress-bar {
      height: 6px;
      background-color: #e0e0e0;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    .content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .mission-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--primary);
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .screen-title {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #1a252f;
    }

    .friendly-text {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 14px;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
    }

    .visual-area {
      background: #eef2f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .feedback-box {
      padding: 16px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
      display: none;
    }

    .feedback-box.correct {
      background-color: #e8f8f0;
      border: 1px solid var(--success);
      color: #1e7e44;
      display: block;
    }

    .feedback-box.incorrect {
      background-color: #fde8e8;
      border: 1px solid var(--danger);
      color: #aa2e2e;
      display: block;
    }

    .next-btn {
      margin-top: auto;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
      width: 100%;
    }

    /* Grafiche Mini-Giochi */
    .turnstile-graphic {
      width: 140px;
      height: 90px;
      background: #333;
      border-radius: 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-panel {
      width: 80px;
      height: 40px;
      background: rgba(0, 150, 255, 0.3);
      border: 2px solid #00aaff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.75rem;
    }

    .fids-board {
      background: #111;
      color: #ffcc00;
      font-family: monospace;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
    }

    .tray-graphic {
      width: 100%;
      height: 80px;
      border: 3px dashed #94a3b8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>✈️ Facile Volare</header>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="content">
    <div class="mission-title" id="mission-title">MISSIONE 1</div>
    <div class="screen-title" id="screen-title">Caricamento...</div>

    <div class="visual-area" id="visual-area" style="display: none;"></div>

    <div class="friendly-text" id="friendly-text"></div>

    <div class="options-container" id="options-container"></div>

    <div class="feedback-box" id="feedback-box"></div>

    <button class="next-btn" id="next-btn" onclick="nextScreen()">AVANTI ➔</button>
  </div>
</div>

<script>
  const screens = [
    // MISSIONE 1
    {
      mission: "MISSIONE 1 · La Mail",
      title: "1.1 L'apertura",
      text: "Hai appena comprato il volo per Barcellona. Ti è arrivata la mail di conferma. E adesso che si fa?",
      visual: null,
      options: [
        { text: "[ APRI LA MAIL ]", correct: true, feedback: "✅ Perfetto! Diamo un'occhiata ai dettagli." }
      ]
    },
    {
      mission: "MISSIONE 1 · La Mail",
      title: "1.2 Trova il codice PNR",
      text: "Se devi fare il check-in o modificare il volo ti servirà la 'targa' del biglietto (il codice PNR a 6 cifre). Tocca quello giusto!",
      visual: null,
      options: [
        { text: "VY6107 (Numero del volo)", correct: false, feedback: "⛔ Quello è il numero del volo, cerca il codice a 6 cifre alfanumerico!" },
        { text: "X7DF2A (Codice PNR)", correct: true, feedback: "✅ Trovato! X7DF2A è la targa del tuo biglietto." },
        { text: "15:30 (Orario)", correct: false, feedback: "⛔ Quello è l'orario di partenza!" }
      ]
    },
    {
      mission: "MISSIONE 1 · La Mail",
      title: "1.3 Ricevuta vs Biglietto",
      text: "Ti presenti ai controlli di sicurezza mostrando solo questa mail. Ti fanno passare?",
      visual: null,
      options: [
        { text: "[A] Sì, certo, la mail dice che ho pagato!", correct: false, feedback: "⛔ Fermi tutti! La mail è solo la ricevuta. Per passare serve la Carta d'Imbarco!" },
        { text: "[B] No, questa è solo la ricevuta, serve la carta d'imbarco.", correct: true, feedback: "✅ Esatto! La carta d'imbarco la otterrai con il check-in." }
      ]
    },

    // MISSIONE 2
    {
      mission: "MISSIONE 2 · I Documenti",
      title: "2.1 Cosa metti in tasca?",
      text: "Mancano pochi giorni. Quale documento infili in tasca per volare in Spagna?",
      visual: null,
      options: [
        { text: "Patente di guida", correct: false, feedback: "⛔ No! La patente serve solo per guidare." },
        { text: "Carta d'Identità", correct: true, feedback: "✅ Perfetto! Per l'Europa basta un documento d'identità valido." },
        { text: "Tessera Sanitaria", correct: false, feedback: "⛔ La tessera sanitaria serve solo in farmacia!" }
      ]
    },

    // MISSIONE 5 & VARCHI
    {
      mission: "MISSIONE 5 · Ai Varchi",
      title: "5.4 Il Bivio delle Fila",
      text: "Hai il biglietto Vueling Basic (solo zainetto). Davanti ai controlli ci sono varie corsie. Quale scegli?",
      visual: null,
      options: [
        { text: "[A] Fast Track", correct: false, feedback: "⛔ Reservata a chi ha biglietti Business o ha acquistato il servizio extra." },
        { text: "[B] Family Lane", correct: false, feedback: "⛔ Riservata a chi viaggia con bambini piccoli e passeggini." },
        { text: "[C] Corsia Standard", correct: true, feedback: "✅ Perfetto! È la corsia giusta per il nostro biglietto." },
        { text: "[D] QPass", correct: false, feedback: "⛔ Comodissima e gratuita a Fiumicino, ma va prenotata online prima di arrivare!" }
      ]
    },
    {
      mission: "MISSIONE 5 · Ai Varchi",
      title: "5.5 La Mossa del Tornello",
      text: "Sei davanti al tornello con la parte di vetro centrale illuminata. Come appoggi la carta d'imbarco dal telefono?",
      visual: `<div class="turnstile-graphic"><div class="glass-panel">VETRO LETTORE</div></div>`,
      options: [
        { text: "[A] Lo faccio scorrere veloce di lato.", correct: false, feedback: "⛔ Il lettore non legge i movimenti veloci!" },
        { text: "[B] Lo sventolo in alto a mezz'aria.", correct: false, feedback: "⛔ Troppo lontano dal vetro!" },
        { text: "[C] Appoggio il barcode ben piatto sul vetro e aspetto 1 secondo immobile.", correct: true, feedback: "✅ BIP! Luce verde, ante aperte e si passa!" }
      ]
    },

    // MISSIONE 6
    {
      mission: "MISSIONE 6 · Controlli di Sicurezza",
      title: "6.1 In Coda",
      text: "Mentre aspetti il tuo turno in fila ai controlli, cosa fai?",
      visual: null,
      options: [
        { text: "[A] Tengo le cuffie con la musica a palla.", correct: false, feedback: "⛔ Cosi ti perdi le indicazioni degli addetti sulle file più veloci!" },
        { text: "[B] Toglio le cuffie e ascolto le dritte degli addetti.", correct: true, feedback: "✅ Bravissima! Ascoltare gli addetti ti fa risparmiare un sacco di tempo." }
      ]
    },
    {
      mission: "MISSIONE 6 · Controlli di Sicurezza",
      title: "6.2 Cosa vuol dire TASCHE VUOTE?",
      text: "L'addetto ti dice: 'Svuoti completamente le tasche'. Cosa lasci dentro?",
      visual: null,
      options: [
        { text: "[A] Lascio solo il cellulare e le sigarette.", correct: false, feedback: "⛔ Ahi! Fa scattare i controlli manuali!" },
        { text: "[B] Lascio l'Oki e due caramelle.", correct: false, feedback: "⛔ Anche se non sono di metallo vanno tolti!" },
        { text: "[C] NIENTE! Tasche vuote significa ZERO oggetti.", correct: true, feedback: "✅ Esatto! Tutto (incluso cellulare, caramelle e sigarette) va nella giacca o nello zaino!" }
      ]
    },
    {
      mission: "MISSIONE 6 · Controlli di Sicurezza",
      title: "6.3 Gestione delle Vaschette",
      text: "Ti accomodi in una delle 4 postazioni libere. Come utilizzi la vaschetta?",
      visual: `<div class="tray-graphic">PIANO DI LAVORO</div>`,
      options: [
        { text: "[A] La metto subito sui rulli e la riempio li.", correct: false, feedback: "⛔ Mai sui rulli! Ostacoli gli altri." },
        { text: "[B] Sfili da sotto ➔ appoggi sul piano ➔ metti tutto dentro ➔ spingi sui rulli.", correct: true, feedback: "✅ Sequenza perfetta! Piatto, ordinato e via sui rulli." }
      ]
    },

    // MISSIONE 7
    {
      mission: "MISSIONE 7 · Area Airside",
      title: "7.2 Il Tabellone Partenze",
      text: "Sul tabellone vedi due voli per Barcellona alla stessa ora. Il tuo biglietto dice VY6107. Dove vai?",
      visual: `<div class="fids-board">15:30 BARCELLONA VY6107 -> GATE A12<br>15:30 BARCELLONA IB5402 -> GATE B04</div>`,
      options: [
        { text: "[A] Al Gate B04, tanto vanno entrambi a Barcellona.", correct: false, feedback: "⛔ Errore! Quello è il volo di un'altra compagnia." },
        { text: "[B] Al Gate A12, perché corrisponde al codice VY6107.", correct: true, feedback: "✅ Beccato! Guarda sempre il numero di volo!" }
      ]
    },

    // FINALE
    {
      mission: "VITTORIA! ✈️",
      title: "Sei pronta a volare!",
      text: "Complimenti! Hai completato tutte le missioni di Facile Volare. Ora conosci ogni segreto per vivere l'aeroporto in totale relax!",
      visual: null,
      options: []
    }
  ];

  let currentScreen = 0;

  function renderScreen() {
    const data = screens[currentScreen];
    
    // Progress
    const progressPercent = ((currentScreen + 1) / screens.length) * 100;
    document.getElementById('progress').style.width = progressPercent + '%';

    document.getElementById('mission-title').innerText = data.mission;
    document.getElementById('screen-title').innerText = data.title;
    document.getElementById('friendly-text').innerText = data.text;

    // Visual area
    const visualArea = document.getElementById('visual-area');
    if (data.visual) {
      visualArea.style.display = 'flex';
      visualArea.innerHTML = data.visual;
    } else {
      visualArea.style.display = 'none';
    }

    // Reset feedback & Next button
    const feedbackBox = document.getElementById('feedback-box');
    feedbackBox.className = 'feedback-box';
    feedbackBox.style.display = 'none';
    
    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'none';

    // Options
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    if (data.options.length === 0) {
      // Screen finale
      nextBtn.innerText = "RICOMINCIA 🔄";
      nextBtn.style.display = 'block';
      nextBtn.onclick = () => { currentScreen = 0; renderScreen(); };
      return;
    }

    data.options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => selectOption(opt);
      optionsContainer.appendChild(btn);
    });
  }

  function selectOption(option) {
    const feedbackBox = document.getElementById('feedback-box');
    feedbackBox.innerText = option.feedback;

    if (option.correct) {
      feedbackBox.className = 'feedback-box correct';
      document.getElementById('next-btn').style.display = 'block';
      document.getElementById('next-btn').onclick = nextScreen;
    } else {
      feedbackBox.className = 'feedback-box incorrect';
    }
  }

  function nextScreen() {
    if (currentScreen < screens.length - 1) {
      currentScreen++;
      renderScreen();
    }
  }

  // Init
  renderScreen();
</script>

</body>
</html>
